<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>异常弹幕档案馆 | Anomaly Archive</title>
    <style>
        /* === 现代色彩与变量系统 === */
        :root {
            --bili-pink: #fb7299;
            --bili-blue: #00aeec;
            --font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            
            /* 深色模式 (Dark) - 默认值 */
            --bg-color: #0f1013;
            --card-bg: #1c1d22;
            --text-main: #eef0f4;
            --text-sec: #8b92a5;
            --border-color: #2a2c33;
            --hover-bg: #2d2f36;
            --glass-bg: rgba(28, 29, 34, 0.75);
            --shadow: rgba(0, 0, 0, 0.4);
        }

        /* 浅色模式 (Light) */
        [data-theme="light"] {
            --bg-color: #f6f7f9;
            --card-bg: #ffffff;
            --text-main: #18191c;
            --text-sec: #767c82;
            --border-color: #e3e5e7;
            --hover-bg: #f1f2f4;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --shadow: rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; }

        body { 
            font-family: var(--font-family); 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px 20px 60px; 
            transition: background-color 0.4s ease, color 0.4s ease;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1200px; margin: 0 auto; position: relative; }
        
        /* === 头部与操作栏 === */
        header { 
            text-align: center; 
            margin-bottom: 40px; 
            position: relative; 
            padding-top: 20px;
        }

        h1 { 
            color: var(--text-main); 
            font-size: 2.5em; 
            margin-bottom: 30px; 
            font-weight: 900; 
            letter-spacing: -0.5px;
        }
        h1 span { color: var(--bili-pink); }

        .theme-toggle-btn {
            position: absolute; 
            top: 10px; 
            right: 0;
            background: var(--card-bg); 
            border: 1px solid var(--border-color);
            color: var(--text-main); 
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer; 
            font-size: 20px; 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 0 4px 12px var(--shadow);
            z-index: 100;
        }
        .theme-toggle-btn:hover { transform: translateY(-3px); border-color: var(--bili-pink); }

        .controls { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 20px; 
            position: sticky;
            top: 20px;
            z-index: 50;
        }
        
        /* 分段控制器 (Mac/iOS风格) */
        .tabs { 
            display: inline-flex; 
            background: var(--glass-bg); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px var(--shadow);
        }
        
        .tab-btn {
            background: transparent; 
            border: none; 
            color: var(--text-sec); 
            padding: 10px 24px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 15px; 
            font-weight: 600; 
            transition: all 0.3s ease; 
        }
        .tab-btn:hover { color: var(--text-main); }
        .tab-btn.active { 
            background: var(--bili-pink); 
            color: #fff; 
            box-shadow: 0 4px 12px rgba(251, 114, 153, 0.3); 
        }
        .tab-btn.blue-mode.active {
            background: var(--bili-blue); 
            box-shadow: 0 4px 12px rgba(0, 174, 236, 0.3);
        }

        /* 历史回看工具栏 */
        .history-bar { 
            display: inline-flex; 
            gap: 12px; 
            align-items: center; 
            background: var(--card-bg); 
            padding: 8px 20px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color);
        }
        
        .date-picker {
            background: transparent; border: none; 
            color: var(--text-main); font-family: inherit; font-size: 14px; font-weight: bold;
            outline: none; cursor: pointer; color-scheme: light dark;
        }
        [data-theme="dark"] .date-picker { color-scheme: dark; }
        [data-theme="light"] .date-picker { color-scheme: light; }

        .live-btn, .refresh-btn {
            background: transparent; border: none; font-weight: bold; font-size: 13px;
            cursor: pointer; transition: 0.2s; padding: 6px 12px; border-radius: 6px;
        }
        .live-btn { background: rgba(251, 114, 153, 0.1); color: var(--bili-pink); display: none; }
        .live-btn:hover { background: var(--bili-pink); color: white; }
        
        .refresh-btn { color: var(--text-sec); }
        .refresh-btn:hover { background: var(--hover-bg); color: var(--text-main); }

        .update-time { 
            display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 5px; 
        }
        .stat-badge { 
            background: var(--card-bg); padding: 6px 16px; border-radius: 20px; 
            font-size: 13px; font-weight: 500; border: 1px solid var(--border-color);
            color: var(--text-sec);
        }
        .stat-badge strong { color: var(--text-main); }

        /* === 卡片网格系统 === */
        .card-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 24px; 
            padding-top: 30px; 
        }

        .video-card {
            background: var(--card-bg); 
            border-radius: 16px; 
            overflow: hidden; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; 
            flex-direction: column;
            border: 1px solid var(--border-color);
            position: relative;
        }
        .video-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 16px 32px var(--shadow); 
            border-color: var(--text-sec);
        }

        .card-cover-box { 
            position: relative; width: 100%; padding-top: 56.25%; 
            background: var(--hover-bg); display: block; overflow: hidden;
        }
        .card-cover { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; transition: transform 0.5s ease;
        }
        .video-card:hover .card-cover { transform: scale(1.05); }

        .rank-badge { 
            position: absolute; top: 0; left: 0; padding: 6px 16px; 
            border-bottom-right-radius: 16px; font-size: 20px; font-weight: 900; 
            color: #fff; background: rgba(0,0,0,0.6); z-index: 2; 
            font-style: italic; backdrop-filter: blur(8px);
        }
        .rank-1 { background: linear-gradient(135deg, #FFB75E 0%, #ED8F03 100%); }
        .rank-2 { background: linear-gradient(135deg, #E0EAFC 0%, #CFDEF3 100%); color: #333; }
        .rank-3 { background: linear-gradient(135deg, #F7971E 0%, #FFD200 100%); }
        
        .duration-badge { 
            position: absolute; bottom: 10px; right: 10px; 
            background: rgba(0,0,0,0.7); color: #fff; padding: 4px 8px; 
            border-radius: 6px; font-size: 12px; font-weight: 600; backdrop-filter: blur(4px); 
        }

        .card-info { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { 
            font-size: 16px; font-weight: 700; line-height: 1.5; 
            color: var(--text-main); margin-bottom: 10px; 
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; 
            overflow: hidden; text-decoration: none; transition: color 0.2s;
        }
        .card-title:hover { color: var(--bili-blue); }

        .card-up { 
            font-size: 13px; color: var(--text-sec); margin-bottom: 16px; 
            text-decoration: none; transition: color 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .card-up:hover { color: var(--bili-pink); }
        .up-icon { width: 16px; height: 16px; fill: currentColor; }

        .main-stat-box { 
            margin-top: auto; background: var(--hover-bg); border-radius: 10px; 
            padding: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; 
            align-items: center;
        }
        .stat-group { text-align: center; flex: 1; }
        .stat-label { font-size: 11px; color: var(--text-sec); margin-bottom: 4px; font-weight: 600; }
        .stat-value { font-size: 20px; font-weight: 900; color: var(--text-main); font-family: 'Courier New', Courier, monospace;}
        
        .type-ratio .highlight { color: var(--bili-pink); }
        .type-count .highlight { color: var(--bili-blue); }
        .divider { width: 1px; height: 24px; background: var(--border-color); }

        .sub-stats { 
            display: flex; justify-content: space-between; font-size: 12px; 
            color: var(--text-sec); padding-top: 8px; border-top: 1px solid var(--border-color); font-weight: 500;
        }

        .reply-box { 
            margin-top: 12px; padding: 10px 12px; background: var(--hover-bg); 
            border-radius: 8px; border-left: 3px solid var(--bili-pink); 
            font-size: 12px; color: var(--text-sec); line-height: 1.5; 
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; 
        }

        .trend-badge { 
            position: absolute; top: 10px; right: 10px; padding: 4px 8px; 
            border-radius: 6px; font-size: 12px; font-weight: 800; z-index: 2; 
        }
        .t-new { background: #FF9F43; color: #fff; }
        .t-up { background: #FF4757; color: #fff; }
        .t-down { background: rgba(0,0,0,0.6); color: #2ED573; backdrop-filter: blur(4px); }

        /* === 状态反馈 === */
        #loading { text-align: center; padding: 80px; color: var(--text-sec); font-size: 1.2em; font-weight: 600; }
        #error-msg { text-align: center; padding: 20px; color: #ff4757; display: none; }
        .empty-state { text-align: center; padding: 60px; color: var(--text-sec); background: var(--card-bg); border-radius: 16px; margin-top: 20px; grid-column: 1/-1; border: 1px solid var(--border-color);}
    </style>
</head>
<body>

<div class="container">
    <header>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn" title="切换主题">🌙</button>
        
        <h1>Anomaly <span>Archive</span></h1>
        <p style="color: var(--text-sec); font-size: 14px; margin-top: -20px; margin-bottom: 30px;">Bilibili 弹幕异常波动监测终端</p>
        
        <div class="controls">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('month_ratio')">📅 本月·浓度</button>
                <button class="tab-btn blue-mode" onclick="switchTab('month_count')">📅 本月·总量</button>
                <button class="tab-btn" onclick="switchTab('all_ratio')">🏆 历史·浓度</button>
                <button class="tab-btn blue-mode" onclick="switchTab('all_count')">🏆 历史·总量</button>
            </div>
            
            <div class="history-bar">
                <span style="font-size: 13px; color: var(--text-sec); font-weight: bold;">历史回溯</span>
                <input type="date" id="datePicker" class="date-picker" onchange="loadHistoryDate()">
                <div style="width: 1px; height: 14px; background: var(--border-color);"></div>
                <button id="liveBtn" class="live-btn" onclick="resetToLive()">🔴 回到最新</button>
                <button class="refresh-btn" onclick="loadData()">🔄 刷新数据</button>
            </div>

            <div class="update-time" id="updateTime">加载中...</div>
        </div>
    </header>

    <div id="loading">📡 正在接收异常数据流...</div>
    <div id="error-msg"></div>
    <div id="mainGrid" class="card-grid"></div>
</div>

<script>
    const LATEST_JSON = 'rank_report.json';
    let globalData = null;
    let currentTab = 'month_ratio'; 
    let isViewingHistory = false;

    // === 主题切换核心逻辑 ===
    const themeBtn = document.getElementById('themeBtn');
    
    function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        if (!savedTheme) {
            const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
            applyTheme(prefersLight ? 'light' : 'dark');
        } else {
            applyTheme(savedTheme);
        }
    }

    function applyTheme(theme) {
        if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            themeBtn.innerText = '☀️';
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.removeAttribute('data-theme');
            themeBtn.innerText = '🌙';
            localStorage.setItem('theme', 'dark');
        }
    }

    function toggleTheme() {
        const current = localStorage.getItem('theme') || (document.documentElement.hasAttribute('data-theme') ? 'light' : 'dark');
        applyTheme(current === 'light' ? 'dark' : 'light');
    }

    function init() {
        initTheme();
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('datePicker').max = today;
        loadData(); 
    }

    async function loadData(targetFile = LATEST_JSON) {
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('error-msg');
        const grid = document.getElementById('mainGrid');
        
        loading.style.display = 'block';
        errorMsg.style.display = 'none';
        grid.innerHTML = '';
        
        try {
            const response = await fetch(targetFile + '?t=' + new Date().getTime());
            if (response.status === 404) throw new Error('未找到该日期的收容记录');
            if (!response.ok) throw new Error('数据同步失败');
            
            const rawData = await response.json();
            if (Array.isArray(rawData)) {
                globalData = { 
                    update_time: rawData[0]?.update_time || '未知', 
                    total_history: rawData.length, 
                    active_sample: rawData.length, 
                    month_rank: rawData, 
                    all_rank: rawData 
                };
            } else {
                globalData = rawData;
            }

            loading.style.display = 'none';
            updateStatusUI();
            switchTab(currentTab);

        } catch (error) {
            loading.style.display = 'none';
            errorMsg.style.display = 'block';
            errorMsg.innerHTML = `<div class="empty-state"><h3>❌ 监测终端连接中断</h3><p>${error.message}</p><p style="font-size:12px; margin-top:10px;">可能当前时间线的数据尚未收容</p></div>`;
        }
    }

    function loadHistoryDate() {
        const dateStr = document.getElementById('datePicker').value;
        if (!dateStr) return;
        isViewingHistory = true;
        loadData(`archives/rank_report_${dateStr}.json`);
        updateUIState();
    }

    function resetToLive() {
        isViewingHistory = false;
        document.getElementById('datePicker').value = ''; 
        loadData(LATEST_JSON);
        updateUIState();
    }

    function updateUIState() {
        document.getElementById('liveBtn').style.display = isViewingHistory ? 'inline-block' : 'none';
        document.querySelector('.refresh-btn').style.display = isViewingHistory ? 'none' : 'inline-block';
    }

    function updateStatusUI() {
        const count = globalData.total_history || globalData.total_sample || 0;
        const timeLabel = isViewingHistory ? '📜 历史档案' : '📅 实时监测';
        document.getElementById('updateTime').innerHTML = `
            <div class="stat-badge">${timeLabel}: <strong>${globalData.update_time}</strong></div>
            <div class="stat-badge">🏛️ 档案总量: <strong style="color:var(--text-main);">${count}</strong></div>
        `;
    }

    function switchTab(tabName) {
        if (!globalData) return;
        currentTab = tabName;

        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        const btnIndex = ['month_ratio', 'month_count', 'all_ratio', 'all_count'].indexOf(tabName);
        if(btnIndex >= 0) document.querySelectorAll('.tab-btn')[btnIndex].classList.add('active');

        let source = tabName.startsWith('month') ? (globalData.month_rank || []) : (globalData.all_rank || []);
        let type = tabName.includes('count') ? 'count' : 'ratio';
        let renderList = [...source];
        
        if (type === 'count') renderList.sort((a, b) => b.q_mark_count - a.q_mark_count);
        else renderList.sort((a, b) => b.ratio_percent - a.ratio_percent);
        
        renderGrid(renderList.slice(0, 50), type);
    }

    function fmtNum(num) {
        if (!num) return '-';
        if (num > 10000) return (num/10000).toFixed(1) + '万';
        return num;
    }

    function fmtTime(sec) {
        if (!sec) return '';
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }

    function renderGrid(data, type) {
        const container = document.getElementById('mainGrid');
        container.innerHTML = '';
        container.className = `card-grid type-${type}`;

        if (data.length === 0) {
            container.innerHTML = `<div class="empty-state">当前档案库暂无符合条件的数据</div>`;
            return;
        }
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    img.src = img.dataset.src;
                    observer.unobserve(img);
                }
            });
        });

        data.forEach((item, index) => {
            const rank = index + 1;
            let trend = type === 'ratio' ? item.ratio_trend : item.count_trend;
            let trendHtml = trend === 'new' ? `<div class="trend-badge t-new">NEW</div>` : (trend > 0 ? `<div class="trend-badge t-up">▲${trend}</div>` : (trend < 0 ? `<div class="trend-badge t-down">▼${Math.abs(trend)}</div>` : ''));
            const valRatio = `${item.ratio_percent.toFixed(2)}%`;
            const valCount = fmtNum(item.q_mark_count);
            let picUrl = (item.pic || '').replace('http:', 'https:');
            let upLink = item.owner_mid ? `https://space.bilibili.com/${item.owner_mid}` : `#`;
            let replyHtml = item.top_reply ? `<div class="reply-box">"${item.top_reply}"</div>` : '';

            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <a href="https://www.bilibili.com/video/av${item.aid}" target="_blank" class="card-cover-box">
                    <img data-src="${picUrl}" class="card-cover lazy">
                    <div class="rank-badge rank-${rank}">${rank}</div>
                    <div class="duration-badge">${fmtTime(item.duration)}</div>
                    ${trendHtml}
                </a>
                <div class="card-info">
                    <a href="https://www.bilibili.com/video/av${item.aid}" target="_blank" class="card-title" title="${item.title}">${item.title}</a>
                    <a href="${upLink}" target="_blank" class="card-up">
                        <svg class="up-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                        <span>${item.owner || '佚名'}</span>
                    </a>
                    <div class="main-stat-box">
                        <div class="stat-group">
                            <div class="stat-value ${type === 'ratio' ? 'highlight' : ''}">${valRatio}</div>
                            <div class="stat-label">异常浓度</div>
                        </div>
                        <div class="divider"></div>
                        <div class="stat-group">
                            <div class="stat-value ${type === 'count' ? 'highlight' : ''}">${valCount}</div>
                            <div class="stat-label">异常总数</div>
                        </div>
                    </div>
                    <div class="sub-stats">
                        <div>观测 ${fmtNum(item.view)}</div>
                        <div>记录 ${fmtNum(item.total_danmaku)}</div>
                    </div>
                    ${replyHtml}
                </div>
            `;
            container.appendChild(card);
            const img = card.querySelector('.lazy');
            if(img) observer.observe(img);
        });
    }

    init();
</script>
</body>
</html>
